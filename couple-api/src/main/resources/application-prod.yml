spring:
  datasource:
    url: jdbc:mysql://localhost:3306/couple_recycle?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

logging:
  level:
    com.couple: info

jwt:
  secret: ${JWT_SECRET}

letter:
  cooldown-seconds: ${LETTER_COOLDOWN_SECONDS:180}

app:
  websocket:
    allowed-origin-patterns: ${WS_ALLOWED_ORIGIN_PATTERNS}

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,info
